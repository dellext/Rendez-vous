<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choix du rendez-vous ❤️</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>

    <div class="coeurs">
        ❤️ 💕 🌸 💗 🌹 💕 ❤️
    </div>

    <div class="container">

        <h1>Parfait ❤️</h1>

        <p>
            Choisis le moment qui te convient le mieux 😊
        </p>

        <div class="choix">

            <input type="date" id="date">

            <input type="time" id="heure">

        </div>

        <button id="confirmBtn">
            Confirmer 💌
        </button>

        <p id="message"></p>

    </div>

    <script>

        const bouton = document.getElementById("confirmBtn");
        const message = document.getElementById("message");
        const dateInput = document.getElementById("date");
        const heureInput = document.getElementById("heure");

        console.log("Page chargée");

        console.log("EmailJS :", typeof emailjs);

        if (typeof emailjs === "undefined") {

            console.error("EmailJS absent");

            message.textContent =
                "EmailJS n'a pas pu être chargé 😢";

        } else {

            console.log("EmailJS chargé");

            emailjs.init("0jOxWfLIn86tCKIDB");

            console.log("EmailJS initialisé");

            bouton.addEventListener("click", async () => {

                console.log("Bouton cliqué");

                const date = dateInput.value;
                const heure = heureInput.value;

                console.log("Date :", date);
                console.log("Heure :", heure);

                if (date === "" || heure === "") {

                    message.textContent =
                        "Choisis une date et une heure 😊";

                    return;
                }

                bouton.disabled = true;
                bouton.textContent =
                    "Envoi en cours... 💌";

                message.textContent =
                    "Je prépare tout ça... ❤️";

                try {

                    console.log("Tentative d'envoi EmailJS...");

                    const response = await emailjs.send(
                        "service_acfuhe4",
                        "template_a6tkmk9",
                        {
                            date_rdv: date,
                            heure_rdv: heure
                        }
                    );

                    console.log("EMAIL ENVOYÉ :", response);

                    message.textContent =
                        `🌹 Rendez-vous confirmé le ${date} à ${heure} ❤️`;

                    bouton.textContent =
                        "Rendez-vous confirmé 💕";

                } catch (error) {

                    console.error(
                        "ERREUR EMAILJS :",
                        error
                    );

                    console.error(
                        "STATUS :",
                        error.status
                    );

                    console.error(
                        "TEXT :",
                        error.text
                    );

                    message.textContent =
                        "Erreur EmailJS : " +
                        (error.text || error.message || "Erreur inconnue 😢");

                    bouton.disabled = false;

                    bouton.textContent =
                        "Réessayer 💌";
                }

            });
        }

    </script>

</body>

</html>
