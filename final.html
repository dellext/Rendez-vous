<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choix du rendez-vous ❤️</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

</head>

<body>

<div class="coeurs">
❤️ 💕 🌸 💗 🌹 💕 ❤️
</div>

<div class="container">

    <h1>Parfait ❤️</h1>

    <p>
        Choisis le moment qui te convient le mieux 😊
    </p>


    <div class="choix">

        <input type="date" id="date">

        <input type="time" id="heure">

    </div>

    <button id="confirmBtn">
        Confirmer 💌
    </button>

    <p id="message"></p>

</div>

<script>

window.onload = function(){

    console.log("Page chargée");

    if(typeof emailjs === "undefined"){

        console.error("EmailJS absent");

        document.getElementById("message").textContent =
        "Erreur EmailJS 😢";

        return;
    }

    console.log("EmailJS chargé");

    emailjs.init("0jOxWfLIn86tCKIDB");

    console.log("EmailJS initialisé");

    document.getElementById("confirmBtn").onclick = async function(){

        console.log("Bouton cliqué");

        let date = document.getElementById("date").value;

        let heure = document.getElementById("heure").value;

        let message = document.getElementById("message");

        if(date === "" || heure === ""){

            message.textContent =
            "Choisis une date et une heure 😊";

            return;

        }

        message.textContent =
        "Envoi en cours... ❤️";

        console.log("Tentative d'envoi");

        console.log("Date :", date);

        console.log("Heure :", heure);

        try{

            let response = await emailjs.send(

                "service_acfuhe4",

                "template_a6tkmk9",

                {
                    date_rdv: date,
                    heure_rdv: heure
                }

            );

            console.log("EMAIL ENVOYÉ :", response);

            message.textContent =
            `🌹 Rendez-vous confirmé le ${date} à ${heure} ❤️`;

        }catch(error){

            console.error("ERREUR EMAILJS :", error);

            message.textContent =
            "Erreur lors de l'envoi 😢";

        }

    };

};

</script>

</body>

</html>
